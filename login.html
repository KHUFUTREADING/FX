<script>
// ===== نظام تسجيل الدخول =====
function isLoggedIn() {
  return localStorage.getItem('khufuLoggedIn') === 'true';
}

function setLoggedIn(value) {
  if (value) {
    localStorage.setItem('khufuLoggedIn', 'true');
  } else {
    localStorage.removeItem('khufuLoggedIn');
    localStorage.removeItem('khufuUserName');
    localStorage.removeItem('khufuUserEmail');
  }
}

// ===== حماية صفحات الكورسات =====
(function protectCourses() {
  const path = window.location.pathname;
  const page = path.split('/').pop() || '';

  const protectedPages = [
    'dashboard.html',
    'course.html',
    'player.html'
  ];

  const isProtected = protectedPages.some(p => page === p || page.startsWith(p));

  if (isProtected && !isLoggedIn()) {
    window.location.href = 'login.html';
  }
})();

// تحديث الهيدر حسب حالة الدخول
function updateHeaderAuth() {
  const loginBtn = document.querySelector('.login-btn');
  if (!loginBtn) return;

  if (isLoggedIn()) {
    loginBtn.textContent = 'تسجيل الخروج';
    loginBtn.href = '#';
    loginBtn.onclick = function (e) {
      e.preventDefault();
      setLoggedIn(false);
      window.location.href = 'index.html';
    };
  } else {
    loginBtn.textContent = 'تسجيل الدخول';
    loginBtn.href = 'login.html';
    loginBtn.onclick = null;
  }
}

// ===== الكود الرئيسي =====
document.addEventListener('DOMContentLoaded', function () {
  updateHeaderAuth();

  // ===== قائمة الموبايل =====
  const menuToggle = document.getElementById('menu-toggle');
  const nav = document.querySelector('.nav');

  if (menuToggle && nav) {
    menuToggle.addEventListener('click', () => {
      nav.classList.toggle('active');
    });
  }
});
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getDatabase, ref, push, set, get } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCTnyFMujoM64OEjVvkPLXlOnMGYUyMAMQ",
    authDomain: "khufu-treding.firebaseapp.com",
    databaseURL: "https://khufu-treding-default-rtdb.firebaseio.com",
    projectId: "khufu-treding",
    storageBucket: "khufu-treding.firebasestorage.app",
    messagingSenderId: "993256232227",
    appId: "1:993256232227:web:630c728c636642f1bf2896",
    measurementId: "G-KQY51H9JPJ"
  };

  const app = initializeApp(firebaseConfig);
  const database = getDatabase(app);

  function showError(message) {
    const toast = document.getElementById('errorToast');
    toast.textContent = message;
    toast.classList.add('show');
    setTimeout(() => {
      toast.classList.remove('show');
    }, 3500);
  }

  // التبويبات
  const tabBtns = document.querySelectorAll('.tab-btn');
  const sections = document.querySelectorAll('.form-section');

  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      tabBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      sections.forEach(s => s.classList.remove('active'));
      document.getElementById(btn.dataset.tab).classList.add('active');
    });
  });

  // تقييد إدخال رقم الواتساب لأرقام فقط + 11 رقم
  const whatsappInput = document.getElementById('whatsapp-input');
  if (whatsappInput) {
    whatsappInput.addEventListener('input', function () {
      // إزالة أي حرف غير رقم
      this.value = this.value.replace(/\D/g, '');
      // قطع الزيادة عن 11 رقم
      if (this.value.length > 11) {
        this.value = this.value.slice(0, 11);
      }
    });
  }

  // ===== تسجيل الدخول =====
  const loginForm = document.getElementById('login-form');
  if (loginForm) {
    loginForm.addEventListener('submit', async function (e) {
      e.preventDefault();

      const email = loginForm.querySelector('input[type="email"]').value.trim().toLowerCase();
      const password = loginForm.querySelector('input[type="password"]').value;

      try {
        const snapshot = await get(ref(database, 'users'));
        const users = snapshot.val();

        if (!users) {
          showError('لم يسجل من قبل');
          return;
        }

        let foundUser = null;
        Object.values(users).forEach(user => {
          if (user.email && user.email.toLowerCase() === email) {
            foundUser = user;
          }
        });

        if (!foundUser) {
          showError('لم يسجل من قبل');
          return;
        }

        if (foundUser.password !== password) {
          showError('كلمة المرور غير صحيحة');
          return;
        }

        if (foundUser.status === 'pending') {
          showError('حسابك قيد المراجعة، انتظر موافقة الإدارة');
          return;
        }

        if (foundUser.status === 'rejected') {
          showError('تم رفض حسابك، تواصل مع الإدارة');
          return;
        }

        if (foundUser.status === 'approved') {
          localStorage.setItem('khufuLoggedIn', 'true');
          localStorage.setItem('khufuUserEmail', email);
          window.location.href = 'dashboard.html';
        }

      } catch (error) {
        console.error(error);
        showError('حدث خطأ، حاول مرة أخرى');
      }
    });
  }

  // ===== إنشاء حساب =====
  const registerForm = document.getElementById('register-form');
  if (registerForm) {
    registerForm.addEventListener('submit', async function (e) {
      e.preventDefault();

      const inputs = registerForm.querySelectorAll('input');
      
      const name = inputs[0].value.trim();
      const email = inputs[1].value.trim().toLowerCase();
      const whatsapp = inputs[2].value.trim();
      const telegram = inputs[3].value.trim();
      const password = inputs[4].value;
      const confirmPassword = inputs[5].value;

      // التحقق من رقم الواتساب: لازم 11 رقم بالضبط وأرقام فقط
      if (!/^\d{11}$/.test(whatsapp)) {
        showError('رقم الواتساب لازم يكون 11 رقم بالضبط');
        return;
      }

      if (password !== confirmPassword) {
        showError('كلمة المرور وتأكيدها غير متطابقين');
        return;
      }

      if (password.length < 6) {
        showError('كلمة المرور لازم تكون 6 أحرف على الأقل');
        return;
      }

      try {
        const snapshot = await get(ref(database, 'users'));
        const users = snapshot.val() || {};

        const emailExists = Object.values(users).some(user => 
          user.email && user.email.toLowerCase() === email
        );
        
        if (emailExists) {
          showError('هذا البريد الإلكتروني مسجل من قبل');
          return;
        }

        const newUser = {
          name: name,
          email: email,
          whatsapp: whatsapp,
          telegram: telegram,
          password: password,
          registeredAt: new Date().toLocaleString('ar-EG'),
          status: 'pending'
        };

        const usersRef = ref(database, 'users');
        const newUserRef = push(usersRef);
        await set(newUserRef, newUser);

        showError('تم إرسال طلب التسجيل بنجاح - انتظر موافقة الإدارة');
        
        setTimeout(() => {
          document.getElementById('register').classList.remove('active');
          document.getElementById('login').classList.add('active');
          tabBtns[0].classList.add('active');
          tabBtns[1].classList.remove('active');
          registerForm.reset();
        }, 2000);

      } catch (error) {
        console.error(error);
        showError('حدث خطأ أثناء التسجيل');
      }
    });
  }
</script>
