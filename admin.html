<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة العملاء | KHUFU TRADING</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 120px 20px 60px;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .admin-header h1 {
            font-size: 1.9rem;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stats {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .stat-box {
            background: rgba(21, 27, 43, 0.8);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 18px 25px;
            border-radius: 14px;
            min-width: 160px;
            text-align: center;
        }
        .stat-box .number {
            font-size: 1.8rem;
            font-weight: 800;
            color: #00d2ff;
        }
        .stat-box .label {
            font-size: 0.9rem;
            color: #a0aec0;
        }
        .table-wrapper {
            overflow-x: auto;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(15, 20, 32, 0.7);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }
        th, td {
            padding: 14px 16px;
            text-align: right;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        th {
            background: rgba(0, 210, 255, 0.08);
            color: #00d2ff;
            font-weight: 700;
            white-space: nowrap;
        }
        td {
            color: #c5d0de;
            font-size: 0.92rem;
        }
        tr:hover td {
            background: rgba(0, 210, 255, 0.04);
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #718096;
        }
        .refresh-btn {
            padding: 10px 18px;
            border-radius: 50px;
            border: none;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            color: white;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            cursor: pointer;
        }
        .approve-btn, .reject-btn {
            border: none;
            padding: 7px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            margin: 2px;
        }
        .approve-btn {
            background: #22c55e;
            color: white;
        }
        .reject-btn {
            background: #ef4444;
            color: white;
        }
        .status-icon {
            font-size: 1.4rem;
            font-weight: bold;
        }
        .icon-approved { color: #22c55e; }
        .icon-rejected { color: #ef4444; }

        /* شاشة الباسورد */
        .login-gate {
            position: fixed;
            inset: 0;
            background: rgba(10, 14, 23, 0.97);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .login-gate.hidden {
            display: none;
        }
        .gate-box {
            background: rgba(21, 27, 43, 0.95);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 40px 35px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        .gate-box h2 {
            color: #00d2ff;
            margin-bottom: 25px;
            font-size: 1.5rem;
        }
        .gate-box input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid #2a3548;
            background: #0f1420;
            color: white;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            margin-bottom: 15px;
            text-align: center;
        }
        .gate-box input:focus {
            outline: none;
            border-color: #00d2ff;
        }
        .gate-box button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            color: white;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
        }
        .gate-error {
            color: #f87171;
            margin-top: 12px;
            font-size: 0.95rem;
            display: none;
        }
    </style>
</head>
<body>

    <!-- شاشة إدخال الباسورد -->
    <div class="login-gate" id="loginGate">
        <div class="gate-box">
            <h2>🔒 دخول الإدارة</h2>
            <input type="password" id="adminPassword" placeholder="أدخل كلمة المرور" autocomplete="off">
            <button onclick="checkPassword()">دخول</button>
            <div class="gate-error" id="gateError">كلمة المرور غير صحيحة</div>
        </div>
    </div>

    <div class="animated-bg">
        <div class="circle circle1"></div>
        <div class="circle circle2"></div>
        <div class="circle circle3"></div>
    </div>

    <header class="header">
        <div class="logo"><a href="index.html" style="text-decoration:none; color:inherit;">KHUFU</a></div>
        <nav class="nav">
            <a href="admin.html" class="login-btn">إدارة العملاء</a>
            <a href="dashboard.html">الكورسات</a>
            <a href="index.html">الرئيسية</a>
        </nav>
    </header>

    <div class="admin-container" id="adminContent" style="display:none;">
        <div class="admin-header">
            <h1>إدارة بيانات العملاء</h1>
            <button class="refresh-btn" onclick="location.reload()">تحديث البيانات</button>
        </div>

        <div class="stats">
            <div class="stat-box">
                <div class="number" id="totalUsers">0</div>
                <div class="label">إجمالي العملاء</div>
            </div>
            <div class="stat-box">
                <div class="number" id="pendingUsers">0</div>
                <div class="label">بانتظار الموافقة</div>
            </div>
            <div class="stat-box">
                <div class="number" id="approvedUsers">0</div>
                <div class="label">تم الموافقة</div>
            </div>
            <div class="stat-box">
                <div class="number" id="rejectedUsers">0</div>
                <div class="label">تم الرفض</div>
            </div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>الاسم</th>
                        <th>البريد الإلكتروني</th>
                        <th>رقم الواتساب</th>
                        <th>يوزر التليجرام</th>
                        <th>تاريخ التسجيل</th>
                        <th>إجراء</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody"></tbody>
            </table>
            <div id="emptyState" class="empty-state" style="display:none;">
                لا يوجد عملاء مسجلين حتى الآن
            </div>
        </div>
    </div>

    <script>
        // ===== حماية الباسورد =====
        const ADMIN_PASSWORD = 'HB*100#300*';

        // لو مسجل دخول قبل كده في نفس الجلسة
        if (sessionStorage.getItem('adminAuth') === 'true') {
            document.getElementById('loginGate').classList.add('hidden');
            document.getElementById('adminContent').style.display = 'block';
        }

        function checkPassword() {
            const input = document.getElementById('adminPassword').value;
            if (input === ADMIN_PASSWORD) {
                sessionStorage.setItem('adminAuth', 'true');
                document.getElementById('loginGate').classList.add('hidden');
                document.getElementById('adminContent').style.display = 'block';
            } else {
                document.getElementById('gateError').style.display = 'block';
                document.getElementById('adminPassword').value = '';
            }
        }

        // Enter للدخول
        document.getElementById('adminPassword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkPassword();
        });
    </script>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
      import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCTnyFMujoM64OEjVvkPLXlOnMGYUyMAMQ",
        authDomain: "khufu-treding.firebaseapp.com",
        databaseURL: "https://khufu-treding-default-rtdb.firebaseio.com",
        projectId: "khufu-treding",
        storageBucket: "khufu-treding.firebasestorage.app",
        messagingSenderId: "993256232227",
        appId: "1:993256232227:web:630c728c636642f1bf2896",
        measurementId: "G-KQY51H9JPJ"
      };

      const app = initializeApp(firebaseConfig);
      const database = getDatabase(app);
      const usersRef = ref(database, 'users');

      onValue(usersRef, (snapshot) => {
        const data = snapshot.val();
        const tbody = document.getElementById('usersTableBody');
        const emptyState = document.getElementById('emptyState');
        const totalUsers = document.getElementById('totalUsers');
        const pendingUsers = document.getElementById('pendingUsers');
        const approvedUsers = document.getElementById('approvedUsers');
        const rejectedUsers = document.getElementById('rejectedUsers');

        tbody.innerHTML = '';

        if (!data) {
          totalUsers.textContent = '0';
          pendingUsers.textContent = '0';
          approvedUsers.textContent = '0';
          rejectedUsers.textContent = '0';
          emptyState.style.display = 'block';
          return;
        }

        emptyState.style.display = 'none';
        const users = Object.entries(data);
        totalUsers.textContent = users.length;

        let pendingCount = 0;
        let approvedCount = 0;
        let rejectedCount = 0;

        users.forEach(([key, user], index) => {
          const status = user.status || 'pending';
          
          if (status === 'pending') pendingCount++;
          if (status === 'approved') approvedCount++;
          if (status === 'rejected') rejectedCount++;

          let actionHTML = '';
          if (status === 'approved') {
            actionHTML = `<span class="status-icon icon-approved">✓</span>`;
          } else if (status === 'rejected') {
            actionHTML = `<span class="status-icon icon-rejected">✗</span>`;
          } else {
            actionHTML = `
              <button class="approve-btn" data-key="${key}">✓ موافقة</button>
              <button class="reject-btn" data-key="${key}">✗ رفض</button>
            `;
          }

          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${index + 1}</td>
            <td>${user.name || '-'}</td>
            <td>${user.email || '-'}</td>
            <td>${user.whatsapp || '-'}</td>
            <td>${user.telegram || '-'}</td>
            <td>${user.registeredAt || '-'}</td>
            <td>${actionHTML}</td>
          `;
          tbody.appendChild(row);
        });

        pendingUsers.textContent = pendingCount;
        approvedUsers.textContent = approvedCount;
        rejectedUsers.textContent = rejectedCount;

        document.querySelectorAll('.approve-btn').forEach(btn => {
          btn.onclick = () => updateStatus(btn.dataset.key, 'approved');
        });
        document.querySelectorAll('.reject-btn').forEach(btn => {
          btn.onclick = () => updateStatus(btn.dataset.key, 'rejected');
        });
      });

      async function updateStatus(key, status) {
        try {
          await update(ref(database, 'users/' + key), { status: status });
        } catch (error) {
          console.error(error);
          alert('حدث خطأ: ' + error.message);
        }
      }
    </script>
