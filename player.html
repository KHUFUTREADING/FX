<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل الفيديو | KHUFU TRADING</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: #0b0f1a;
            color: #fff;
            min-height: 100vh;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(15, 20, 35, 0.95);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo a {
            color: #00d2ff;
            text-decoration: none;
            font-weight: 900;
            font-size: 1.5rem;
        }
        .back-btn {
            color: #00d2ff;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
        }
        .player-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .video-title {
            font-size: 1.6rem;
            margin-bottom: 20px;
            color: #00d2ff;
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 210, 255, 0.15);
            aspect-ratio: 16 / 9;
        }
        video, iframe {
            width: 100%;
            height: 100%;
            display: block;
            border: none;
        }
        .controls-info {
            margin-top: 20px;
            padding: 15px 20px;
            background: rgba(21,27,43,0.7);
            border-radius: 12px;
            font-size: 0.95rem;
            color: #aaa;
        }
    </style>
</head>
<body>
    <script>
        // حماية الصفحة - لازم يكون مسجل دخول
        if (localStorage.getItem('khufuLoggedIn') !== 'true') {
            window.location.href = 'login.html';
        }
    </script>

    <header class="header">
        <div class="logo"><a href="index.html">KHUFU</a></div>
        <a href="#" id="backLink" class="back-btn">← العودة للدروس</a>
    </header>

    <div class="player-container">
        <h1 class="video-title" id="videoTitle">جاري التحميل...</h1>
        
        <div class="video-wrapper" id="videoWrapper">
            <!-- الفيديو هيتضاف هنا -->
        </div>

        <div class="controls-info">
            استخدم أزرار التحكم أسفل الفيديو للتشغيل / الإيقاف / الصوت / الشاشة الكاملة.
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const videoUrl = params.get('url');
        const title = params.get('title') || 'درس';
        const section = params.get('section');
        const level = params.get('level');

        document.getElementById('videoTitle').textContent = decodeURIComponent(title);
        
        // رجوع لصفحة الدروس
        const backLink = document.getElementById('backLink');
        if (section && level) {
            backLink.href = `course.html?section=\( {section}&level= \){level}`;
        } else {
            backLink.href = 'dashboard.html';
        }

        // تشغيل الفيديو
        if (videoUrl) {
            const decodedUrl = decodeURIComponent(videoUrl);
            const wrapper = document.getElementById('videoWrapper');

            // دالة لاستخراج ID من يوتيوب
            function getYouTubeId(url) {
                const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
                const match = url.match(regExp);
                return (match && match[2].length === 11) ? match[2] : null;
            }

            const youtubeId = getYouTubeId(decodedUrl);

            if (youtubeId) {
                // يوتيوب
                wrapper.innerHTML = `
                    <iframe 
                        src="https://www.youtube.com/embed/${youtubeId}?rel=0&modestbranding=1" 
                        frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen"
                        allowfullscreen
                        webkitallowfullscreen
                        mozallowfullscreen>
                    </iframe>
                `;
            } 
            // أي رابط embed (مثل playmogo / morencius / vimeo / doodstream ...)
            else if (
                decodedUrl.includes('/embed/') || 
                decodedUrl.includes('/e/') ||
                decodedUrl.includes('vimeo.com') || 
                decodedUrl.includes('morencius.com') ||
                decodedUrl.includes('playmogo.com') ||
                decodedUrl.includes('doodstream') ||
                decodedUrl.includes('dood.')
            ) {
                wrapper.innerHTML = `
                    <iframe 
                        src="${decodedUrl}" 
                        frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen"
                        allowfullscreen
                        webkitallowfullscreen
                        mozallowfullscreen>
                    </iframe>
                `;
            }
            // مصدر فيديو مباشر (MP4)
            else {
                wrapper.innerHTML = `
                    <video controls controlsList="nodownload" playsinline>
                        <source src="${decodedUrl}" type="video/mp4">
                        متصفحك لا يدعم تشغيل الفيديو.
                    </video>
                `;
            }
        }
    </script>
</body>
</html>
