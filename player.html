<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل الفيديو | KHUFU TRADING</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* ===== محتوى الصفحة فقط ===== */
        .player-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 130px 20px 60px;
        }
        .video-title {
            font-size: 1.6rem;
            margin-bottom: 20px;
            color: #00d2ff;
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 210, 255, 0.15);
            aspect-ratio: 16 / 9;
        }
        video, iframe {
            width: 100%;
            height: 100%;
            display: block;
            border: none;
        }
        .controls-info {
            margin-top: 18px;
            padding: 14px 18px;
            background: rgba(21,27,43,0.7);
            border-radius: 12px;
            font-size: 0.95rem;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="animated-bg">
        <div class="circle circle1"></div>
        <div class="circle circle2"></div>
        <div class="circle circle3"></div>
    </div>

    <!-- نفس هيدر صفحة الكورسات بالظبط -->
    <header class="header">
        <div class="logo"><a href="index.html" style="text-decoration:none; color:inherit;">KHUFU</a></div>
        <nav class="nav" id="navMenu">
            <a href="login.html" class="login-btn">تسجيل الدخول</a>
            <a href="index.html">الرئيسية</a>
            <a href="index.html#about">من نحنا</a>
            <a href="index.html#services">الخدمات</a>
            <a href="dashboard.html">الكورسات</a>
            <a href="index.html#chart">شارت مباشر</a>
        </nav>
        <div class="menu-toggle" id="menu-toggle">☰</div>
    </header>

    <div class="player-container">
        <h1 class="video-title" id="videoTitle">جاري التحميل...</h1>
        
        <div class="video-wrapper" id="videoWrapper">
            <!-- الفيديو هيتضاف هنا -->
        </div>

        <div class="controls-info">
            استخدم أزرار التحكم أسفل الفيديو للتشغيل / الإيقاف / الصوت / الشاشة الكاملة.
        </div>
    </div>

    <script>
        // حماية الصفحة
        if (localStorage.getItem('khufuLoggedIn') !== 'true') {
            window.location.href = 'login.html';
        }

        // فتح/إغلاق قائمة الموبايل
        const menuToggle = document.getElementById('menu-toggle');
        const navMenu = document.getElementById('navMenu');

        menuToggle.addEventListener('click', () => {
            navMenu.classList.toggle('active');
        });

        // كود الفيديو
        const params = new URLSearchParams(window.location.search);
        const videoUrl = params.get('url');
        const title = params.get('title') || 'درس';

        document.getElementById('videoTitle').textContent = decodeURIComponent(title);

        if (videoUrl) {
            const decodedUrl = decodeURIComponent(videoUrl);
            const wrapper = document.getElementById('videoWrapper');

            function getYouTubeId(url) {
                const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
                const match = url.match(regExp);
                return (match && match[2].length === 11) ? match[2] : null;
            }

            const youtubeId = getYouTubeId(decodedUrl);

            if (youtubeId) {
                wrapper.innerHTML = `
                    <iframe 
                        src="https://www.youtube.com/embed/${youtubeId}?rel=0&modestbranding=1" 
                        frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen"
                        allowfullscreen
                        webkitallowfullscreen
                        mozallowfullscreen>
                    </iframe>
                `;
            } 
            else if (
                decodedUrl.includes('/embed/') || 
                decodedUrl.includes('/e/') ||
                decodedUrl.includes('vimeo.com') || 
                decodedUrl.includes('morencius.com') ||
                decodedUrl.includes('playmogo.com') ||
                decodedUrl.includes('doodstream') ||
                decodedUrl.includes('dood.')
            ) {
                wrapper.innerHTML = `
                    <iframe 
                        src="${decodedUrl}" 
                        frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen"
                        allowfullscreen
                        webkitallowfullscreen
                        mozallowfullscreen>
                    </iframe>
                `;
            }
            else {
                wrapper.innerHTML = `
                    <video controls controlsList="nodownload" playsinline>
                        <source src="${decodedUrl}" type="video/mp4">
                        متصفحك لا يدعم تشغيل الفيديو.
                    </video>
                `;
            }
        }
    </script>
</body>
</html>
